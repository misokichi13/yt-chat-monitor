<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Chat Monitor</title>
  <style>
    body { font-family: sans-serif; margin: 15px; background: #f5f5f5; color: #333; }
    h1 { font-size: 1.2rem; }
    .input-group { margin-bottom: 15px; }
    input { padding: 8px; width: 70%; font-size: 14px; }
    button { padding: 8px 12px; font-size: 14px; background: #FF0000; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #chat-box { background: white; border: 1px solid #ccc; padding: 10px; height: 350px; overflow-y: scroll; border-radius: 4px; }
    .chat-item { border-bottom: 1px dotted #eee; padding: 6px 0; font-size: 13px; }
    .author { font-weight: bold; color: #1a73e8; }
  </style>
</head>
<body>

  <h1>YouTube Live Chat Monitor</h1>

  <div class="input-group">
    <input type="text" id="videoId" placeholder="YouTube Liveの動画IDを入力">
    <button onclick="startMonitoring()">取得開始</button>
  </div>

  <div id="chat-box"></div>

  <!-- Firebase (SDK v9 Compatibility) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // 1. Firebaseの設定
    const firebaseConfig = {
      apiKey: "AIzaSyCKQTbRrjmQICyhLTPVmU9bAvf1ClKTpZA",
      authDomain: "comment-13d0e.firebaseapp.com",
      projectId: "comment-13d0e",
      storageBucket: "comment-13d0e.firebasestorage.app",
      messagingSenderId: "34144551673",
      appId: "1:34144551673:web:1712fb8b568a0b2a419828",
      measurementId: "G-Y4SLYF4DZ2"
    };

    // Firebaseの初期化
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 2. YouTube APIキー
    const YOUTUBE_API_KEY = "AIzaSyDKrF414aFaLZHMDyl5EB8k9gn9oH1-9rA";

    let nextPageToken = "";
    let intervalId = null;

    // チャット取得メイン処理
    async function startMonitoring() {
      const videoId = document.getElementById("videoId").value.trim();
      if (!videoId) {
        alert("動画IDを入力してください");
        return;
      }

      // LiveChatIDを取得
      const liveChatId = await getLiveChatId(videoId);
      if (!liveChatId) {
        alert("ライブチャットを取得できませんでした。配信中か確認してください。");
        return;
      }

      alert("チャット取得を開始します！");
      document.getElementById("chat-box").innerHTML = "";
      nextPageToken = ""; // トークン初期化

      // 最初の1回を実行
      fetchChatMessages(liveChatId);

      // 定期的にコメントを取得 (約5秒間隔)
      if (intervalId) clearInterval(intervalId);
      intervalId = setInterval(() => {
        fetchChatMessages(liveChatId);
      }, 5000);
    }

    // 動画IDから LiveChatID を取得する関数
    async function getLiveChatId(videoId) {
      const url = `https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=${videoId}&key=${YOUTUBE_API_KEY}`;
      const res = await fetch(url);
      const data = await res.json();
      if (data.items && data.items.length > 0) {
        return data.items[0].liveStreamingDetails?.activeLiveChatId || null;
      }
      return null;
    }

    // チャットメッセージを取得して「画面表示」と「Firestore保存」を行う関数
    async function fetchChatMessages(liveChatId) {
      let url = `https://www.googleapis.com/youtube/v3/liveChat/messages?liveChatId=${liveChatId}&part=snippet,authorDetails&key=${YOUTUBE_API_KEY}`;
      if (nextPageToken) {
        url += `&pageToken=${nextPageToken}`;
      }

      try {
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.items && data.items.length > 0) {
          nextPageToken = data.nextPageToken;

          for (const item of data.items) {
            // 1. 画面表示
            displayComment(item);

            // 2. Firestoreへ保存
            await saveCommentAndUser(item);
          }
        }
      } catch (error) {
        console.error("メッセージ取得・保存エラー:", error);
      }
    }

    // 画面にコメントを追加する関数
    function displayComment(item) {
      const author = item.authorDetails.displayName;
      const message = item.snippet.displayMessage;

      const chatBox = document.getElementById("chat-box");
      const div = document.createElement("div");
      div.className = "chat-item";
      div.innerHTML = `<span class="author">${author}:</span> ${message}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // コメント1件ごとにFirestoreに保存する関数
    async function saveCommentAndUser(item) {
      try {
        const author = item.authorDetails;
        const message = item.snippet.displayMessage || "";
        const publishedAt = new Date(item.snippet.publishedAt);

        const userId = author.channelId;
        const userName = author.displayName;
        const userIcon = author.profileImageUrl;

        // 1. users コレクションの更新（来店記録＋コメント数カウントアップ）
        const userRef = db.collection('users').doc(userId);
        await userRef.set({
          name: userName,
          icon: userIcon,
          lastSeenAt: firebase.firestore.FieldValue.serverTimestamp(),
          commentCount: firebase.firestore.FieldValue.increment(1)
        }, { merge: true });

        // 2. comments コレクションの保存（発言ログ）
        const commentId = item.id;
        const commentRef = db.collection('comments').doc(commentId);
        await commentRef.set({
          userId: userId,
          userName: userName,
          message: message,
          createdAt: publishedAt
        });
      } catch (err) {
        console.error("Firestore書き込み失敗:", err);
      }
    }
  </script>
</body>
</html>
